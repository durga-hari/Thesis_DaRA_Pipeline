# One environment for every backend (AlphaPose, RTMPose, OSNet/ResNet, DeepSORT/StrongSORT).
#
#   conda env create -f environment.yml
#   conda activate posepipe
#   mim install "mmengine==0.10.4" "mmcv==2.1.0" "mmpose==1.3.2"   # only needed for pose.type=rtmpose
#
# torch 2.1.2 + CUDA 12.1 is chosen because MMCV 2.1.0 ships prebuilt CUDA wheels for it.
# For RTX 50-series GPUs (sm_120) see README "GPU notes".
name: posepipe
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg                       # param study --make-clips
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.2
      - torchvision==0.16.2
      - "numpy<2.0"
      - "opencv-python>=4.8,<4.11"
      - pyyaml
      - tqdm
      - scipy
      - pandas
      - matplotlib
      - pillow
      - "ultralytics>=8.1,<8.4"  # YOLOv8 detector
      - easydict                 # AlphaPose config loader
      - torchreid==0.2.5         # OSNet / ResNet-50 ReID
      - gdown
      - tensorboard
      - yacs
      - h5py
      - openmim                  # installs mmengine / mmcv / mmpose
